spring.application.name=gestion-productos
server.port=${PORT:8080}

# Ruta del archivo SQLite. Variable de entorno DB_PATH; si no existe, ./data/productos.db
app.db.path=${DB_PATH:./data/productos.db}
# Inserta datos de ejemplo SOLO cuando el archivo de base de datos se crea por primera vez
app.seed=${APP_SEED:true}
# Un producto con esta cantidad o menos se marca como "inventario bajo"
app.inventario-bajo=5

spring.thymeleaf.cache=false
server.error.include-stacktrace=never
server.error.include-message=never
