<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Editar producto')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container py-4" style="max-width: 720px;">
  <h1 class="h3 fw-bold mb-3">Editar producto</h1>

  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form th:action="@{/productos/{c}/editar(c=${codigoOriginal})}" th:object="${producto}" method="post"
            class="needs-validation" novalidate>
        <div class="alert alert-danger py-2 small" th:if="${#fields.hasErrors('*')}">
          Revisa los campos marcados en rojo.
        </div>
        <div class="mb-3">
          <label for="codigo" class="form-label">Código (no se puede cambiar)</label>
          <input type="text" id="codigo" th:field="*{codigo}" class="form-control" readonly>
          <div class="text-danger small" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}">Error</div>
        </div>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre *</label>
          <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                 th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" required maxlength="120">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
          <div class="invalid-feedback" th:unless="${#fields.hasErrors('nombre')}">El nombre es obligatorio.</div>
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3" maxlength="500"
                    th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error</div>
        </div>
        <div class="row">
          <div class="col-sm-6 mb-3">
            <label for="precio" class="form-label">Precio *</label>
            <input type="number" id="precio" th:field="*{precio}" class="form-control"
                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" required min="0" step="0.01">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}">Error</div>
            <div class="invalid-feedback" th:unless="${#fields.hasErrors('precio')}">Ingresa un precio igual o mayor que 0.</div>
          </div>
          <div class="col-sm-6 mb-3">
            <label for="cantidad" class="form-label">Cantidad *</label>
            <input type="number" id="cantidad" th:field="*{cantidad}" class="form-control"
                   th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'" required min="0" step="1">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}">Error</div>
            <div class="invalid-feedback" th:unless="${#fields.hasErrors('cantidad')}">Ingresa una cantidad entera igual o mayor que 0.</div>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
